<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mã Xác Thực OTP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
            color: #111111;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .email-container {
            max-width: 440px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 0px;
            /* Thiết kế góc vuông hiện đại */
            border: 1px solid #e0e0e0;
            padding: 40px;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #000000;
            margin-top: 0;
            margin-bottom: 40px;
        }

        .text-main {
            font-size: 14px;
            color: #333333;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .otp-box {
            background-color: #000000;
            padding: 8px;
            text-align: center;
            margin-bottom: 30px;
        }

        .otp-code {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #ffffff;
            margin: 0;
            padding-left: 8px;
        }

        .text-sub {
            font-size: 12px;
            color: #777777;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        .email-footer {
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
            font-size: 11px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="brand-title">TNB.Studio</div>

        <p class="text-main">Mã xác thực (OTP) của bạn:</p>

        <div class="otp-box">
            <p class="otp-code">{{otp}}</p>
        </div>

        <p class="text-sub">
            Có hiệu lực trong 5 phút.<br>
            Không chia sẻ mã này với người khác.
        </p>

        <div class="email-footer">
            Tự động gửi bởi <span class="brand-title">TNB.Studio</span>. Vui lòng không phản hồi.<br>
            &copy; 2026 <span class="brand-title">TNB.Studio</span>
        </div>
    </div>
</body>

</html>
